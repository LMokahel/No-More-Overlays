modLoader = "javafml"
loaderVersion = "[0,)"
issueTrackerURL = "https://github.com/LMokahel/No-More-Overlays/issues"
license = "All Rights Reserved"
clientSideOnly = true

[[mods]]
modId = "nomoreoverlays"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "DontNag"
description = "Minecraft mod that allows the user to toggle all of Minecraft's screen effects."
logoFile = "icon.png"

[[dependencies.nomoreoverlays]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nomoreoverlays]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},${minecraft_version_cap})"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nomoreoverlays]]
modId = "cloth_config"
mandatory = true
versionRange = "[${cloth_config_version},)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "nomoreoverlays.mixins.json"